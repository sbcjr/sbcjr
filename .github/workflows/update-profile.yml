name: Update profile

on:
  schedule:
    - cron: "17 11 * * *"   # ~6:17am ET daily, after games finalize
  workflow_dispatch:          # lets you run it on demand from the Actions tab
  push:
    branches: [main, master]
    paths:
      - .github/workflows/update-profile.yml
      - scripts/update_profile.py

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update profile block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/profile-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile data [skip ci]"
            git push
          fi
